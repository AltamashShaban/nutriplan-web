<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6C5CE7">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NutriPlan">
<meta name="description" content="Healthy halal meal plans, calorie tracking and progress charts. All data stays on your device.">
<title>NutriPlan — Halal Meal Planner</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --violet:#6C5CE7; --violet-2:#8B7BF5; --violet-3:#A99BFA; --violet-ink:#5546C8;
  --lav:#EFECFF; --lav-2:#F7F5FF;
  --bg:#F4F3FC; --card:#FFFFFF; --ink:#1B1A33; --muted:#8C8BA8; --line:#EDEAF9;
  --cyan:#2BD0DE; --blue:#5B9BFF; --coral:#FF7C6B; --amber:#FFC65C; --mint:#4FD1A5;
  --p:#6C5CE7; --c:#2BD0DE; --f:#FF9F7C;
  --r:26px; --r2:20px; --r3:15px;
  --sh:0 8px 26px rgba(89,73,196,.09);
  --sh2:0 14px 40px rgba(89,73,196,.16);
  --font:'Poppins','Montserrat',-apple-system,BlinkMacSystemFont,'Segoe UI Variable','Segoe UI',Inter,system-ui,sans-serif;
}
body.dark{
  --violet:#8B7BF5; --violet-2:#A99BFA; --violet-3:#C4BAFC; --violet-ink:#7A6AE8;
  --lav:#241F44; --lav-2:#1C1836;
  --bg:#100E22; --card:#191634; --ink:#EDEBFA; --muted:#8683A8; --line:#252044;
  --sh:0 8px 26px rgba(0,0,0,.4); --sh2:0 14px 40px rgba(0,0,0,.5);
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);line-height:1.5;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
#app{max-width:600px;margin:0 auto;padding-bottom:104px;min-height:100vh}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ============ type ============ */
.ov{font-size:10.5px;font-weight:750;letter-spacing:1.4px;text-transform:uppercase;
  color:var(--violet);margin-bottom:7px}
.ov.m{color:var(--muted)}
h1.big{font-size:27px;font-weight:800;letter-spacing:-.9px;line-height:1.18}
h2.mid{font-size:20px;font-weight:750;letter-spacing:-.5px}
.num{font-weight:800;letter-spacing:-1.6px;line-height:1}
.muted{color:var(--muted)}
.tiny{font-size:11.5px;color:var(--muted);font-weight:500}
.sm{font-size:13px}
.hl{color:var(--violet);font-weight:750}
.center{text-align:center}
.hidden{display:none!important}

/* ============ violet header + sheet ============ */
.vh{background:linear-gradient(160deg,var(--violet) 0%,var(--violet-2) 100%);
  color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 34px;position:relative;overflow:hidden}
.vh:after{content:'';position:absolute;width:230px;height:230px;border-radius:50%;
  background:rgba(255,255,255,.07);top:-120px;right:-70px}
.vh:before{content:'';position:absolute;width:150px;height:150px;border-radius:50%;
  background:rgba(255,255,255,.05);bottom:-90px;left:-40px}
.vh > *{position:relative;z-index:1}
.land{position:relative}
.land > *{position:relative;z-index:1}
/* The two rules above set position:relative on every direct child. These must
   out-rank them, or the overlay becomes a laid-out flex item and shoves the
   content down the screen — which is exactly what happened once. Two classes
   in the selector beats one, and they come last. */
.pat{object-fit:cover;opacity:.05;pointer-events:none;user-select:none}
.vh > .pat,.land > .pat{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.vh .ov{color:rgba(255,255,255,.72)}
.vh h1.big{color:#fff}
.sheet-b{background:var(--bg);border-radius:28px 28px 0 0;margin-top:-24px;
  padding:22px 20px 8px;position:relative;z-index:2;min-height:40vh}
.wrap{padding:20px 20px 8px}

/* ============ cards ============ */
.c{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:16px}
.c.tight{padding:16px}
.c.flat{box-shadow:none;border:1.5px solid var(--line)}
.vcard{background:linear-gradient(150deg,var(--violet) 0%,var(--violet-2) 100%);color:#fff;
  border-radius:var(--r);padding:20px;box-shadow:var(--sh2);margin-bottom:16px;position:relative;overflow:hidden}
.vcard:after{content:'';position:absolute;width:180px;height:180px;border-radius:50%;
  background:rgba(255,255,255,.08);top:-90px;right:-60px}
.vcard > *{position:relative;z-index:1}
.vcard .ov{color:rgba(255,255,255,.75)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:11px}

/* ============ tiles & buttons ============ */
.tile{width:52px;height:52px;border-radius:17px;display:flex;align-items:center;
  justify-content:center;font-size:24px;flex-shrink:0;background:var(--lav);line-height:1}
.tile.s{width:42px;height:42px;border-radius:14px;font-size:19px}
.plus{width:32px;height:32px;border-radius:11px;background:var(--lav);color:var(--violet);
  display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:600;
  flex-shrink:0;line-height:0;padding:0}
.plus .ic{margin:0}
.btn{background:var(--violet);color:#fff;border-radius:16px;padding:15px 18px;font-weight:650;
  font-size:15px;width:100%;box-shadow:0 8px 20px rgba(108,92,231,.32);transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.975);opacity:.9}
.btn.ghost{background:var(--lav);color:var(--violet);box-shadow:none}
.btn.line{background:transparent;border:1.8px solid var(--line);color:var(--ink);box-shadow:none}
.btn.danger{background:transparent;border:1.8px solid var(--line);color:var(--coral);box-shadow:none}
.btn.s{padding:11px 16px;font-size:13.5px;width:auto;border-radius:13px}
.btn.white{background:#fff;color:var(--violet);box-shadow:0 8px 20px rgba(0,0,0,.13)}

/* ============ chips / segmented ============ */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:14px;font-size:13px;font-weight:650;background:var(--card);
  color:var(--muted);white-space:nowrap;box-shadow:var(--sh)}
.chip.on{background:var(--violet);color:#fff;box-shadow:0 6px 16px rgba(108,92,231,.3)}
.chip.mini{padding:6px 12px;font-size:11.5px;border-radius:10px;box-shadow:none;background:var(--lav);color:var(--violet)}
.seg{display:flex;background:rgba(255,255,255,.18);border-radius:15px;padding:4px;gap:3px}
.seg button{flex:1;padding:9px 4px;border-radius:12px;font-size:12px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;color:rgba(255,255,255,.72)}
.seg button.on{background:#fff;color:var(--violet);box-shadow:0 3px 10px rgba(0,0,0,.12)}

/* ============ week strip ============ */
.week{display:flex;gap:4px;justify-content:space-between}
.wd{flex:1;text-align:center;padding:8px 2px;border-radius:16px;position:relative}
.wd .d{font-size:9.5px;font-weight:700;letter-spacing:.8px;opacity:.72}
.wd .n{font-size:15.5px;font-weight:750;margin-top:3px}
.wd.on{background:#fff;color:var(--violet)}
.wd.on .d{opacity:.6}
.wd .dot{width:4px;height:4px;border-radius:50%;background:currentColor;margin:3px auto 0;opacity:.85}

/* ============ list rows ============ */
.it{display:flex;align-items:center;gap:13px;padding:11px 0}
.it + .it{border-top:1px solid var(--line)}
.it .mid{flex:1;min-width:0}
.it .nm{font-size:14.5px;font-weight:650;letter-spacing:-.2px;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis}
.it .dt{font-size:12px;color:var(--muted);margin-top:2px;font-weight:500}
.it .rt{text-align:right;flex-shrink:0}
.it .rt b{font-size:15px;font-weight:750}
.x{color:var(--muted);font-size:17px;padding:2px 4px;line-height:0;opacity:.55;
  display:flex;align-items:center;justify-content:center}
.tap{cursor:pointer}
.kcal{display:inline-flex;align-items:center;gap:4px;font-weight:750}
.kcal i{font-style:normal;color:var(--violet)}

/* ============ bars ============ */
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.bar.thin{height:5px}
.mac{margin-bottom:13px}
.mac:last-child{margin-bottom:0}
.mac .t{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:6px;font-weight:600}
.sw{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:6px;vertical-align:middle}

/* ============ grid cards (recipes) ============ */
/* Recipe cards carry no imagery — an abstract mark tells you nothing about
   how a dish looks, so the space goes to the name and the numbers instead. */
.rlist{display:flex;flex-direction:column;gap:12px}
.rrow{background:var(--card);border-radius:var(--r2);padding:18px 19px;box-shadow:var(--sh);
  display:flex;align-items:center;gap:18px;width:100%;text-align:left;
  transition:transform .12s,box-shadow .12s}
.rrow:active{transform:scale(.985)}
.rrow .body{flex:1;min-width:0}
.rrow .nm{font-size:15.5px;font-weight:680;letter-spacing:-.25px;line-height:1.35;color:var(--ink)}
.rrow .meta{font-size:12px;color:var(--muted);margin-top:8px;font-weight:550;line-height:1.4}
.rrow .vtag{color:var(--mint);font-weight:700}
.rrow .kc{text-align:right;flex-shrink:0}
.rrow .kc b{display:block;font-size:21px;font-weight:790;letter-spacing:-.7px;line-height:1}
.rrow .kc span{font-size:10.5px;color:var(--muted);font-weight:660}

/* ============ modal ============ */
.ovl{position:fixed;inset:0;background:rgba(27,26,51,.5);z-index:100;display:flex;
  align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sh{background:var(--bg);width:100%;max-width:600px;max-height:94vh;overflow-y:auto;
  border-radius:30px 30px 0 0;animation:up .32s cubic-bezier(.2,.9,.3,1);position:relative}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sh .grab{width:42px;height:4.5px;border-radius:99px;background:var(--line);
  margin:10px auto 0;position:sticky;top:10px;z-index:5}
.sh .bd{padding:8px 20px 34px}
.cl{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;
  background:var(--card);color:var(--muted);font-size:17px;z-index:6;box-shadow:var(--sh);
  display:flex;align-items:center;justify-content:center}

/* ============ inputs ============ */
input,select{font:inherit;font-weight:600;width:100%;padding:14px 15px;border:1.8px solid var(--line);
  border-radius:16px;background:var(--card);color:var(--ink);outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--violet)}
input::placeholder{color:var(--muted);font-weight:500}
label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.4px;color:var(--muted);
  margin-bottom:7px;text-transform:uppercase}
.fld{margin-bottom:15px}
.srch{position:relative;margin-bottom:14px}
.srch input{padding-left:44px;border-radius:18px;border-color:transparent;box-shadow:var(--sh)}
.srch .i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px}
.step{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;
  padding:6px;box-shadow:var(--sh)}
.step button{width:38px;height:38px;border-radius:12px;background:var(--lav);color:var(--violet);
  font-size:19px;font-weight:600;flex-shrink:0;display:flex;align-items:center;
  justify-content:center;padding:0;line-height:0}
.step button .ic{margin:0}
.step .v{flex:1;text-align:center;font-weight:750;font-size:15px}

/* ============ nav ============ */
nav{position:fixed;bottom:0;left:0;right:0;z-index:60;display:flex;justify-content:center;
  pointer-events:none;padding:0 14px calc(14px + env(safe-area-inset-bottom))}
nav .inner{display:flex;background:var(--card);border-radius:24px;padding:8px;gap:2px;
  box-shadow:0 10px 34px rgba(60,44,150,.20);pointer-events:auto;width:100%;max-width:420px}
body.dark nav .inner{box-shadow:0 10px 34px rgba(0,0,0,.5)}
nav .n{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px;
  color:var(--muted);font-size:9.5px;font-weight:700;border-radius:17px;transition:background .2s,color .2s}
nav .n.on{background:var(--lav);color:var(--violet)}
nav .n svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}

/* ============ charts ============ */
.chart{width:100%;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--muted);font-weight:650}
.vcard .chart text{fill:rgba(255,255,255,.7)}
.gauge{position:relative;display:flex;align-items:center;justify-content:center}
.gauge .lb{position:absolute;text-align:center}
.stat{background:var(--card);border-radius:var(--r2);padding:15px 10px;text-align:center;box-shadow:var(--sh)}
.stat b{display:block;font-size:21px;font-weight:800;letter-spacing:-.8px}
.stat span{font-size:10.5px;color:var(--muted);font-weight:650}
.stat .dl{font-size:10.5px;font-weight:700;margin-top:4px}
.up{color:var(--coral)}.down{color:var(--mint)}
.empty{text-align:center;padding:40px 16px;color:var(--muted);font-size:13.5px;font-weight:500}
.empty .b{font-size:38px;margin-bottom:10px;opacity:.4}
.vcard .empty,.vh .empty{color:rgba(255,255,255,.75)}
.vcard .empty .b,.vh .empty .b{opacity:.6}
.vcard .empty .ic,.vh .empty .ic{margin:0 auto}
.toast{position:fixed;bottom:104px;left:50%;transform:translateX(-50%);background:var(--ink);
  color:var(--bg);padding:13px 22px;border-radius:99px;font-size:13.5px;font-weight:650;z-index:200;
  box-shadow:0 10px 30px rgba(0,0,0,.3);animation:up .22s;max-width:88%;text-align:center}
.ing{list-style:none}
.ing li{padding:11px 0;font-size:14px;display:flex;justify-content:space-between;gap:14px;font-weight:550}
.ing li + li{border-top:1px solid var(--line)}
.ing li span{color:var(--muted);flex-shrink:0;font-weight:600}
ol.st{padding-left:0;list-style:none;counter-reset:s}
ol.st li{counter-increment:s;position:relative;padding-left:38px;margin-bottom:15px;font-size:13.8px;font-weight:520}
ol.st li:last-child{margin-bottom:0}
ol.st li:before{content:counter(s);position:absolute;left:0;top:-1px;width:26px;height:26px;
  border-radius:9px;background:var(--lav);color:var(--violet);font-size:12px;font-weight:750;
  display:flex;align-items:center;justify-content:center}
.dots{display:flex;gap:6px;align-items:center}
.backlink{display:block;text-align:left;color:var(--violet);font-size:13px;font-weight:650;
  padding:0;margin:0 0 12px;width:auto}
.dots i{height:7px;border-radius:99px;background:var(--line);transition:width .3s,background .3s}
.ic{display:block;flex-shrink:0}
.tile .ic,.plus .ic{color:var(--violet)}
.tile.on .ic{color:#fff}
.kcal .ic{color:var(--violet)}
.vcard .ic,.vh .ic{color:#fff}
.iconrow{display:flex;align-items:center;gap:7px}
.ov .ic{display:inline-block;vertical-align:-3px;margin-right:5px}

/* ---------- landing: exactly one viewport, never scrolls ---------- */
.land{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;
  justify-content:space-between;overflow:hidden;text-align:center;
  background:linear-gradient(165deg,var(--violet) 0%,var(--violet-2) 100%);color:#fff;
  padding:calc(28px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom))}
.land-hero{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center}
.land-logo{width:104px;height:104px;display:block;margin:0 auto;
  filter:drop-shadow(0 10px 26px rgba(0,0,0,.28))}
.land-sub{opacity:.85;margin:12px auto 0;font-size:15px;line-height:1.55;
  font-weight:500;max-width:280px}
.land-cta{flex:0 0 auto}
.land-link{display:block;width:100%;margin-top:14px;font-size:12.5px;
  color:rgba(255,255,255,.85);font-weight:600;text-decoration:underline;padding:4px}
#app.ob{padding-bottom:0}
@media (max-height:600px){
  .land-logo{width:78px;height:78px}
  .land h1.big{font-size:27px!important;margin-top:16px!important}
  .land-sub{font-size:13.5px;margin-top:9px}
}

/* ======================= RESPONSIVE ======================= */
.chips::-webkit-scrollbar,.week::-webkit-scrollbar{display:none}
.chips,.week{scrollbar-width:none;-webkit-overflow-scrolling:touch}
img,svg{max-width:100%}

/* --- small phones (iPhone SE, 320-359px) --- */
@media (max-width:359px){
  .vh{padding-left:15px;padding-right:15px}
  .sheet-b,.wrap{padding-left:14px;padding-right:14px}
  .c{padding:16px;border-radius:22px}
  h1.big{font-size:23px}
  .tile{width:44px;height:44px;border-radius:14px;font-size:20px}
  .tile.s{width:38px;height:38px;border-radius:12px;font-size:17px}
  .g3{gap:7px}
  .stat{padding:12px 6px}
  .stat b{font-size:18px}
  .rlist{gap:10px}
  .rrow{padding:15px 16px;gap:12px}
  .rrow .nm{font-size:14.5px}
  nav .n{font-size:9px}
  nav .n svg{width:19px;height:19px}
  .btn{padding:14px 14px;font-size:14.5px}
  .wd .n{font-size:14px}
}

/* --- standard phones --- */

/* --- large phones & small tablets --- */
@media (min-width:560px){
  .rlist{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  h1.big{font-size:30px}
  .vh{padding-left:26px;padding-right:26px;padding-top:calc(24px + env(safe-area-inset-top))}
  .sheet-b,.wrap{padding-left:26px;padding-right:26px}
}

/* --- tablet / desktop: present the app in a device-like frame --- */
@media (min-width:760px){
  body{background:#E9E7F6;padding:28px 0}
  body.dark{background:#0A0918}
  #app{max-width:520px;background:var(--bg);border-radius:38px;overflow:hidden;
    box-shadow:0 30px 80px rgba(60,44,150,.22);min-height:auto;
    padding-bottom:110px;position:relative}
  body.dark #app{box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .vh{border-radius:38px 38px 0 0}
  nav{position:sticky;bottom:0;margin-top:-96px;padding-bottom:18px}
  nav .inner{max-width:390px}
  .ovl{align-items:center}
  .sh{max-width:520px;border-radius:30px;max-height:86vh}
}
@media (min-width:760px) and (max-height:720px){
  body{padding:0}
  #app{border-radius:0}
  .vh{border-radius:0}
}

/* --- landscape phones: shorter headers so content still fits --- */
@media (max-height:520px) and (orientation:landscape){
  .vh{padding-top:14px;padding-bottom:24px}
  h1.big{font-size:21px}
  .gauge{transform:scale(.85);transform-origin:center}
}

/* --- accessibility --- */
@media (prefers-reduced-motion:reduce){
  *,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}
}
@media (prefers-color-scheme:dark){
  body.auto-dark{--violet:#8B7BF5;--bg:#100E22;--card:#191634;--ink:#EDEBFA;--line:#252044}
}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"></div>
<script>

/* =========================================================================
   RECIPE LIBRARY — 173 recipes adapted from the Pinch of Yum healthy, vegan
   and quick archives. Pork and alcohol were filtered out at source; alcohol
   swaps are noted inline in the ingredients.

   IMPORTANT — where the numbers come from:
   The source had no nutrition data at all. Calories and macros here are
   CALCULATED: every ingredient line was parsed, US volumes and weights were
   converted to grams, matched against a reference table of ingredient macros,
   totalled, and divided by a serving count derived from the finished weight.
   Expect roughly ±15-20%. They are estimates, not laboratory values, and the
   app labels them as such.

   R2(name, emoji, types, protein, carbs, fat, minutes, veg, tags,
      ingredients, steps, servingGrams, sourceUrl, availabilityNote, estimated)
   ========================================================================= */
const R2=(n,e,t,p,c,f,min,veg,tags,ing,st,g,src,note,est)=>

const RECIPES=[

R2("Arroz Con Pollo","🍽️",["lunch","dinner"],20.9,48.5,14.3,45,false,["light"],[["boneless skinless chicken thighs","1 lb"],["shallot, minced","1"],["jalapeno or serrano pepper, minced","1"],["red bell pepper, diced, chopped fresh thyme","1"],["(15 oz) can crushed tomatoes","1"],["bay leaf","1"],["uncooked white rice","1 1/2 cups"],["tomato paste","3 tbsp"],["chicken broth","2 cups"],["(12 oz) jar green olives","1"],["olive oil","2-3 tbsp"],["ground cumin","2 tsp"],["allspice","1 tsp"],["kosher salt, divided","2 tsp"],["garlic, minced","4 cloves"]],["Heat oil in a Dutch oven and brown the chicken thighs, seasoning with salt; remove and set aside.","Add the shallot, jalapeno, garlic, and bell pepper to the same pot and saute until fragrant, scraping up the browned bits.","Stir in the tomato paste, cumin, allspice, and bay leaf, then add the crushed tomatoes and the chicken broth (using the extra cup in place of the beer).","Bring to a simmer, stir in the rice, and nestle the chicken back in.","Cover and cook until the rice is tender and the chicken is cooked through.","Stir in chopped cilantro, a squeeze of lime, and the chopped green olives before serving."],342,"https://pinchofyum.com/arroz-con-pollo","Recipe adjusted to remove alcohol - see ingredients note",0),
R2("Instant Pot Pot Roast","🍽️",["lunch","dinner"],36.9,20.7,29.5,45,false,["high-protein","one-pan"],[["chuck roast","3 lbs"],["oil","2 tbsp"],["onion, quartered","1"],["garlic, minced","5 cloves"],["large carrots, chopped","3"],["celery stalks, chopped","3"],["mushrooms, halved","1 cup"],["red potatoes","1 lb"],["whole","as needed"],["tomato paste","2 tbsp"],["beef broth","2-3 cups"],["sprigs fresh rosemary","2"],["sprigs fresh thyme","5"],["Worcestershire sauce","2 tbsp"],["salt","2-3 tsp"],["cornstarch whisked with 1/2 cup cold water","1/4 cup"]],["Sear the chuck roast in oil in the Instant Pot on saute mode until browned on both sides; remove.","Saute the onion and garlic briefly, then stir in the tomato paste.","Add the beef broth (using the extra amount in place of the wine), Worcestershire sauce, herbs, and salt, and return the roast to the pot along with the carrots, celery, potatoes, and mushrooms.","Pressure cook on high for about 60-70 minutes with a natural release.","Remove the meat and vegetables, then thicken the remaining liquid with the cornstarch slurry on saute mode to make a gravy.","Serve the shredded roast and vegetables with the gravy spooned over top."],444,"https://pinchofyum.com/instant-pot-pot-roast","Recipe adjusted to remove alcohol - see ingredients note",0),
R2("Oven Risotto with Garlic Roasted Mushrooms and Arugula","🍚",["lunch","dinner"],20,85.7,19.4,45,false,["balanced"],[["mushrooms","8-16 oz"],["olive oil","1 tbsp"],["garlic","2 cloves"],["salt. olive oil","1 tbsp"],["garlic","2 cloves"],["arborio rice","1 1/2 cups"],["chicken or vegetable stock","1 cup"],["butter","1 tbsp"],["lemon juice","1 tbsp"],["Parmesan. arugula","2 tbsp, grated"],["olive oil","1 tbsp"],["lemon juice","1 tbsp"],["salt","to taste"],["Parmesan","2 tbsp, grated"],["HALAL SWAP: the original recipe adds a splash of dry white wine after","as needed"],["it still gives the risotto its bright","as needed"]],["Heat the oven to 350F. Toss the mushrooms with olive oil, garlic, and salt on a baking sheet.","In a Dutch oven, saute garlic in olive oil, add the arborio rice and toast until the pan looks dry, then add a splash of stock and lemon juice (in place of the wine) and let it sizzle out.","Add the rest of the stock, bring to a simmer, cover, and transfer to the oven alongside the mushroom pan.","Bake about 14-15 minutes, then pull the risotto and let the mushrooms roast a bit longer at a higher temperature until golden.","Stir butter, lemon juice, and Parmesan into the risotto.","Toss the arugula with olive oil, lemon juice, salt, and Parmesan for a simple side salad.","Serve the risotto topped with the roasted mushrooms and arugula salad."],302,"https://pinchofyum.com/oven-risotto-with-garlic-roasted-mushrooms-and-arugula","Recipe adjusted to remove alcohol - see ingredients note",0),
R2("Spicy Shrimp Veracruz","🦐",["lunch","dinner","snack","breakfast"],20.8,31.9,5.1,45,false,["high-protein","light"],[["uncooked shrimp","1 lb"],["pint cherry tomatoes, halved","1"],["pickled jalapenos, minced","2 tbsp"],["golden raisins","1/4 cup"],["rice","1 cup"],["capers","2 tbsp"],["olive oil","2 tbsp"],["dried oregano","1 tsp"],["sweet mini peppers, chopped","8-10"],["garlic, minced","2 cloves"],["salt","1/2 tsp"],["water","1 cup"],["lemon or lime to finish","1"],["HALAL SWAP: the original recipe adds 2 tablespoons of red wine to the",""]],["Cook the rice separately. Heat the olive oil in a large skillet and saute the mini peppers 5-10 minutes until soft.","Turn the heat down and add the tomatoes, garlic, jalapenos, capers, raisins, oregano, and salt; saute 5-10 minutes until fragrant and the tomatoes release their juice.","Stir in the water/broth and vinegar swap and let it incorporate for a minute.","Nestle the shrimp into the sauce and gently poach them until just cooked through and pink. Serve over the rice with a squeeze of lemon or lime."],374,"https://pinchofyum.com/spicy-shrimp-veracruz","Recipe adjusted to remove alcohol - see ingredients note",0),
R2("Masoor Dal Tadka","🍛",["lunch","dinner"],16,35,7,40,true,["desi","low budget","vegetarian"],[["masoor dal","1 cup"],["onion","1"],["tomatoes","2"],["garlic cloves","4"],["ginger","1 in"],["green chilies","2"],["cumin","1 tsp"],["turmeric","1/2 tsp"],["coriander powder","1 tsp"],["red chili","1/2 tsp"],["oil","1 tbsp"],["Salt","to taste"],["Coriander","2 tbsp, chopped"],["water","4 cups"]],["Rinse the masoor dal in several changes of water until the water runs clear, then drain.","Put it in a pot with 4 cups water, the turmeric and a good pinch of salt. Bring to a boil, skim off the foam that rises, then lower the heat and simmer uncovered for 20-25 minutes until the lentils collapse and the dal thickens.","While it cooks, heat the oil in a small pan over medium heat and add the cumin seeds. Wait for them to sizzle and darken slightly, about 30 seconds — this is where most of the flavour comes from.","Add the sliced onion and fry for 6-8 minutes until properly golden, not just soft. Stir in the garlic and ginger and cook one minute more until the raw smell goes.","Add the chopped tomatoes, coriander powder and red chilli. Cook 5-6 minutes, pressing the tomatoes down, until they break apart and you see oil separating at the edges.","Pour the tarka into the dal and stir it through. Simmer 5 minutes so the flavours settle, then finish with slit green chillies and fresh coriander."],407,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Moong Dal Fry","🍛",["lunch","dinner"],18,34,8,45,true,["desi","low budget","vegetarian"],[["moong dal","1.25 cups"],["onion","1"],["tomatoes","2"],["garlic cloves","3"],["ginger","1 tsp"],["cumin","1 tsp"],["turmeric","1/2 tsp"],["coriander","1 tsp"],["chili","1/2 tsp"],["oil","1 tbsp"],["Salt","to taste"],["water","4 cups"]],["Rinse the moong dal well and drain. Boil it with 4 cups water, the turmeric and salt for about 20 minutes, until soft but the grains still hold their shape.","Heat the oil in a separate pan and crackle the cumin seeds for 30 seconds.","Add the onion and fry 6-8 minutes to a deep golden, then add the garlic and ginger for a minute.","Stir in the tomatoes, coriander powder and chilli. Cook 5-7 minutes until the mixture thickens and the oil separates.","Tip the masala into the dal, stir, and simmer 5-7 minutes. Add hot water if it tightens too much — moong dal should pour, not stand up.","Finish with fresh coriander and a squeeze of lemon."],389,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Chana Masala","🍛",["lunch","dinner"],15,42,8,47,true,["desi","low budget","vegetarian"],[["dry chana, soaked and boiled (about 4 cups cooked)","1.5 cups"],["onion","1"],["tomatoes","2"],["garlic cloves","4"],["ginger","1 in"],["cumin","1 tsp"],["Spices","1 tsp"],["oil","1 tbsp"]],["Soak the chana overnight in plenty of water, then boil with salt for 40-50 minutes until tender enough to crush between your fingers. Keep the cooking water.","Heat the oil and fry the cumin seeds until fragrant, then add the onion and cook 8-10 minutes to a deep brown — chana masala needs the onion darker than usual.","Add the ginger and garlic, cook a minute, then the tomatoes and ground spices. Cook this down for 8-10 minutes until it is a thick paste and oil pools at the sides.","Add the drained chana with a cup of their cooking water. Simmer 15 minutes uncovered.","Crush a few spoonfuls of chana against the side of the pot — this thickens the gravy without any cream.","Finish with garam masala, coriander and lemon juice off the heat."],290,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Rajma Masala","🍛",["lunch","dinner"],17,45,7,60,true,["desi","low budget","vegetarian"],[["dry rajma, soaked and boiled (about 4 cups cooked)","1.5 cups"],["onion","1"],["tomatoes","2"],["ginger garlic","1 tbsp"],["Spices","1 tsp"],["oil","1 tbsp"]],["Soak the rajma overnight, then boil 45-60 minutes until completely soft. Undercooked rajma stays chalky, so test several beans.","Fry the onion in the oil for 8-10 minutes until browned, then add the ginger-garlic and cook out the raw smell.","Add the tomatoes and spices and cook 8-10 minutes until thick and glossy with oil separating.","Add the rajma with a cup of its cooking liquid. Simmer 20 minutes on low so the beans take on the masala.","Mash a few beans against the pot to thicken the gravy naturally.","Finish with garam masala and fresh coriander."],300,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Lobia Curry","🍛",["lunch","dinner"],14,39,7,45,true,["desi","low budget","vegetarian"],[["dry lobia, soaked and boiled (about 4 cups cooked)","1.5 cups"],["onion","1"],["tomatoes","2"],["Garlic","2 cloves"],["Ginger","1 tsp, grated"],["Spices","1 tsp"],["oil","1 tbsp"]],["Soak the lobia overnight and boil 30-40 minutes until tender but not falling apart.","Heat the oil and toast the cumin seeds for 30 seconds until they darken.","Add the onion and fry 6-8 minutes to golden, then the garlic and ginger for one minute.","Stir in the tomatoes and spices and cook 6-8 minutes until the oil separates.","Add the lobia with a little of its water and simmer 20 minutes on low heat.","Mash a spoonful of the beans to thicken, then garnish with coriander and a squeeze of lemon."],285,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Aloo Palak","🍛",["lunch","dinner","snack"],4.8,22.9,4,25,true,["desi","low budget","vegetarian","quick"],[["potatoes","2"],["spinach","300g"],["onion","1 medium"],["tomato","1 medium"],["garlic","2 cloves"],["ginger","1 tsp, grated"],["cumin","1 tsp"],["turmeric","1 tsp"],["chili","as needed"],["oil","1 tbsp"]],["Boil the potatoes until just tender, about 12 minutes, then drain and cut into rough cubes. Do not overcook them or they will break up later.","Wash the spinach thoroughly and chop it roughly — no need to blanch for this version.","Heat the oil and crackle the cumin, then add the onion and cook 5-6 minutes until soft and golden at the edges.","Add the garlic, ginger, turmeric and chilli and fry one minute, then the tomato. Cook until it breaks down and the oil separates.","Add the spinach in handfuls, letting each batch wilt before adding more. It will lose most of its volume.","Fold in the potatoes, season, and cook uncovered 5-7 minutes so the extra water steams off — this dish should be thick, not watery."],230,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Bhindi Masala","🍛",["lunch","dinner","snack"],3.2,14,3.9,25,true,["desi","low budget","vegetarian","quick"],[["okra","500g"],["onion","1 medium"],["tomato","1 medium"],["garlic","2 cloves"],["cumin","1 tsp"],["coriander","2 tbsp, chopped"],["oil","1 tbsp"]],["Wash the okra and dry it completely with a cloth. Any water left on it is what makes bhindi slimy.","Top, tail and slice into rounds about a centimetre thick.","Heat the oil in a wide pan and cook the okra on medium-high for 8-10 minutes without stirring much, until the edges brown and the sliminess disappears. Lift it out and set aside.","In the same pan soften the onion, then add the garlic, cumin and tomato. Cook until the tomato collapses.","Return the okra, season, and toss gently for 5 minutes. Stir as little as possible from here.","Finish with fresh coriander and a pinch of amchur or a squeeze of lemon."],188,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Mixed Vegetable Sabzi","🍛",["lunch","dinner","snack"],3.6,13.8,3.8,25,true,["desi","low budget","vegetarian","quick"],[["Carrot","1 medium"],["peas","1 cup"],["cauliflower","1 cup"],["beans","1 cup"],["onion","1 medium"],["tomato","1 medium"],["spices","1 tsp"],["oil","1 tbsp"]],["Cut the carrot, beans and cauliflower into similar-sized pieces so they finish cooking together.","Heat the oil, crackle the cumin, and fry the onion 5 minutes until translucent.","Add the tomato and the ground spices and cook until the tomato breaks down and the oil separates.","Add the harder vegetables first — carrot and beans — and toss to coat, then the cauliflower and peas.","Add a splash of water, cover, and cook 10-12 minutes on low, stirring once or twice.","Uncover for the last 2 minutes to dry off the moisture. The vegetables should keep a little bite."],158,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Soya Keema","🍛",["lunch","dinner","snack"],25.7,23.3,0.5,25,false,["desi","low budget","meat","quick","high-protein"],[["soya chunks","2 cups"],["onion","1 medium"],["tomato","1 medium"],["peas","1 cup"],["ginger-garlic","1 tbsp"],["spices","1 tsp"]],["Soak the soya chunks in hot water for 10 minutes until soft, then drain and squeeze them dry — press hard, they hold a surprising amount of water.","Pulse them briefly in a grinder or chop finely so they resemble mince.","Heat the oil and fry the onion 6-8 minutes until golden, then add the ginger-garlic paste and cook a minute.","Add the tomato and spices and bhunno until thick and the oil separates.","Stir in the soya and peas, add half a cup of water, and cook 10-12 minutes so it absorbs the masala rather than sitting on top of it.","Finish with garam masala and coriander."],134,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Anda Bhurji","🍛",["breakfast","lunch","dinner","snack"],13.7,5.3,11.2,25,true,["desi","low budget","vegetarian","quick","high-protein"],[["eggs","8"],["onion","1 medium"],["tomato","1 medium"],["chilies","as needed"],["coriander","2 tbsp, chopped"],["turmeric","1 tsp"]],["Beat the eggs with a pinch of salt and set aside.","Heat the oil and soften the chopped onion for 4-5 minutes.","Add the green chillies and tomato and cook 3-4 minutes until the tomato loses its raw edge.","Add the turmeric and stir for 30 seconds.","Lower the heat, pour in the eggs and let them sit 10 seconds before stirring. Scramble slowly with a spatula, pushing rather than beating.","Take the pan off the heat while the eggs still look slightly underdone — they carry on cooking. Finish with coriander."],158,"","Very Low cost · everyday Pakistani ingredients",0),
R2("Chicken & Moong Dal Khichdi","🍛",["breakfast","lunch","dinner"],28,62,8,40,false,["desi","low budget","meat"],[["chicken breast","300g"],["yellow moong dal","1 cup"],["basmati rice","1/2 cup"],["onion","1"],["tomatoes","2"],["ginger-garlic paste","1 tbsp"],["cumin","1 tsp"],["turmeric","1/2 tsp"],["coriander powder","1 tsp"],["oil","1 tbsp"],["Salt","to taste"],["Fresh coriander","2 tbsp, chopped"],["water","5 cups"]],["Rinse the rice and moong dal together until the water runs clear, then soak 15 minutes and drain.","Heat the oil in a heavy pot and fry the onion 6-8 minutes until golden.","Add the ginger-garlic paste, cook a minute, then the chicken. Cook 5 minutes until it turns opaque all over.","Add the tomatoes, cumin, turmeric and coriander powder and cook until the tomatoes break down.","Add the drained rice and dal with 5 cups of water and a good amount of salt. Bring to a boil, then cover and simmer on low for 30-35 minutes.","It should be soft and porridge-like, not separate grains. Add hot water if it dries out. Rest 5 minutes and finish with coriander."],420,"","Low cost · everyday Pakistani ingredients",0),
R2("Chicken Keema with Mixed Vegetables","🍛",["lunch","dinner"],35,27,15,40,false,["desi","low budget","meat","high-protein"],[["lean chicken mince","500g"],["onion","1"],["tomatoes","2"],["carrot","1"],["peas","1 cup"],["capsicum","1"],["ginger-garlic paste","1 tbsp"],["oil","1 tbsp"],["Common spices","1 tsp"]],["Heat the oil and fry the onion 6-8 minutes until golden brown.","Add the ginger-garlic paste and cook one minute, then add the chicken mince.","Break the mince up thoroughly with the back of a spoon as it cooks — lumps will not season properly. Cook until it releases water and that water evaporates, about 10 minutes.","Add the tomatoes and spices and bhunno until the mixture is dry and glossy.","Stir in the carrot, peas and capsicum, cover, and cook 10 minutes until just tender.","Finish with garam masala and coriander."],297,"","Low cost · everyday Pakistani ingredients",0),
R2("Chicken Shorba","🍛",["lunch","dinner"],30,14,9,40,false,["desi","low budget","meat","high-protein"],[["chicken breast","400g"],["onion","1"],["carrot","1"],["garlic cloves","2"],["ginger","1 inch"],["Black pepper","to taste"],["oil","1 tbsp"],["chicken stock/water","6 cups"],["Fresh coriander","2 tbsp, chopped"]],["Heat the oil in a deep pot and soften the onion, garlic and ginger for 5 minutes without browning them much.","Add the chicken and cook 5 minutes until it turns white on all sides.","Add the diced carrot and the stock. Bring to a boil, then skim any foam from the surface — this is what keeps the shorba clear.","Lower the heat and simmer gently for 30 minutes, uncovered.","Lift out the chicken, shred it with two forks and return it to the pot.","Season generously with black pepper, finish with coriander and a squeeze of lemon."],533,"","Low cost · everyday Pakistani ingredients",0),
R2("Palak Chicken","🍛",["lunch","dinner"],36,18,14,40,false,["desi","low budget","meat","high-protein"],[["chicken breast","500g"],["spinach","400g"],["onion","1"],["tomatoes","2"],["low-fat yogurt","1/2 cup"],["ginger-garlic paste","1 tbsp"],["oil","1 tbsp"],["Common spices","1 tsp"]],["Blanch the spinach in boiling water for 2 minutes, then drain and plunge into cold water. This keeps it green rather than khaki.","Blend it coarsely — a little texture is better than a smooth purée.","Heat the oil and fry the onion 6-8 minutes to golden, then add the ginger-garlic paste for a minute.","Add the chicken and cook until sealed, then the tomatoes and spices. Cook until the oil separates and the chicken is nearly done.","Fold in the spinach and simmer 8 minutes.","Take the pan off the heat, then stir in the yogurt — adding it off the heat stops it splitting. Return to low heat for 2 minutes."],346,"","Low cost · everyday Pakistani ingredients",0),
R2("Lauki Chicken","🍛",["lunch","dinner"],31,17,13,40,false,["desi","low budget","meat","high-protein"],[["chicken breast","500g"],["bottle gourd","500g"],["onion","1"],["tomatoes","2"],["ginger-garlic paste","1 tbsp"],["oil","1 tbsp"],["Common spices","1 tsp"]],["Peel the bottle gourd, halve it, scrape out any large seeds and cut into 2cm cubes.","Heat the oil and fry the onion until golden, 6-8 minutes.","Add the ginger-garlic paste, then the chicken, and cook 5 minutes until sealed.","Add the tomatoes and spices and bhunno until the oil separates.","Add the lauki and half a cup of water, cover, and simmer 20 minutes.","The gourd is ready when a knife slides through easily but the cubes still hold together. Finish with coriander."],340,"","Low cost · everyday Pakistani ingredients",0),
R2("Chana Chicken Curry","🍛",["lunch","dinner"],32,50,10,40,false,["desi","low budget","meat","high-protein"],[["chicken breast","300g"],["dry chana, soaked and boiled (about 4 cups cooked)","1.5 cups"],["onion","1 medium"],["tomatoes","2 medium"],["ginger-garlic","1 tbsp"],["cumin","1 tsp"],["coriander","2 tbsp, chopped"],["turmeric","1 tsp"],["garam masala","1 tsp"],["oil","1 tbsp"]],["Soak the chana overnight and boil until tender, keeping the cooking water.","Heat the oil and fry the onion 8 minutes until deep golden.","Add the ginger-garlic and cook a minute, then the chicken. Cook 5-6 minutes until it colours.","Add the tomatoes, cumin, coriander, turmeric and garam masala and bhunno 8 minutes until thick and oily at the edges.","Stir in the chana with a cup of their water and simmer 20 minutes so both take on the masala.","Crush a few chana to thicken the gravy and finish with fresh coriander."],320,"","Low cost · everyday Pakistani ingredients",0),
R2("Healthy Anda Curry","🍛",["lunch","dinner"],18,7,21,40,true,["desi","low budget","vegetarian"],[["boiled eggs","11"],["onion","1 medium"],["tomatoes","2 medium"],["ginger-garlic","1 tbsp"],["spices","1 tsp"],["oil","1 tbsp"]],["Boil the eggs for 9 minutes, cool them in cold water and peel.","Score each egg lightly two or three times with a knife so the gravy gets inside.","Heat the oil and fry the onion 6-8 minutes until golden, then add the ginger-garlic for a minute.","Add the tomatoes and spices and cook 8 minutes until thick and the oil separates.","Add half a cup of water, bring to a simmer, then slide in the eggs.","Simmer gently 10 minutes, spooning gravy over the eggs. Do not stir hard or they will break. Finish with coriander."],200,"","Low cost · everyday Pakistani ingredients",0),
R2("Healthy Tandoori Chicken","🍛",["lunch","dinner"],38,5,14,40,false,["desi","low budget","meat","high-protein"],[["chicken","600g"],["low-fat yogurt","2 tbsp"],["lemon","1"],["ginger-garlic","1 tbsp"],["paprika","1 tsp"],["cumin","1 tsp"],["coriander","2 tbsp, chopped"]],["Score the chicken deeply two or three times per piece so the marinade reaches the middle.","Mix the yogurt, lemon juice, ginger-garlic, paprika and cumin with salt into a thick paste.","Rub it well into the cuts and refrigerate at least 2 hours, ideally overnight.","Bring the chicken to room temperature for 20 minutes before cooking, and shake off the excess marinade so it roasts rather than steams.","Bake or air fry at 200°C for 20-25 minutes, turning once, until the juices run clear.","Give it 2-3 minutes under a hot grill for colour, then rest 5 minutes and finish with lemon and coriander."],163,"","Low cost · everyday Pakistani ingredients",0),
R2("Healthy Chicken Pulao","🍛",["lunch","dinner"],30,54,10,40,false,["desi","low budget","meat"],[["chicken","500g"],["basmati rice","1 cup"],["onion","1 medium"],["chicken stock","1 cup"],["whole spices","1 tsp"],["oil","1 tbsp"]],["Rinse the rice until the water runs clear, then soak 20 minutes and drain.","Heat the oil in a heavy pot and fry the whole spices for 30 seconds until fragrant.","Add the onion and cook 8 minutes until golden brown.","Add the chicken and brown it well on all sides, about 6 minutes.","Add the drained rice and stir gently for a minute to coat every grain, then pour in the stock. It should sit about 2cm above the rice.","Bring to a boil, cover tightly, and cook on the lowest heat for 15 minutes. Rest 10 minutes off the heat before lifting the lid, then fluff with a fork."],380,"","Low cost · everyday Pakistani ingredients",0),
R2("Savory Oats Chicken Porridge","🍛",["breakfast","lunch","dinner"],29,36,9,40,false,["desi","low budget","meat","high-protein"],[["chicken","450g"],["oats","1 cup"],["carrot","1 medium"],["onion","1 medium"],["garlic","2 cloves"],["stock","1 cup"]],["Heat a little oil and soften the onion and garlic for 4 minutes.","Add the chicken and cook until it turns opaque, about 6 minutes.","Add the diced carrot and the stock and bring to a simmer.","Stir in the oats and cook 10-12 minutes on low, stirring often so they do not catch on the bottom.","It should thicken to a loose porridge — add hot stock if it stiffens too much.","Season well with salt and pepper. Oats need more seasoning than you expect. Finish with coriander or spring onion."],400,"","Low cost · everyday Pakistani ingredients",0),
R2("Healthy Chicken Karahi","🍛",["lunch","dinner"],35,11,17,40,false,["desi","meat","high-protein"],[["chicken breast","500g"],["tomatoes","2 medium"],["onion (optional)","1 medium"],["ginger-garlic","1 tbsp"],["cumin","1 tsp"],["coriander","2 tbsp, chopped"],["black pepper","to taste"],["garam masala","1 tsp"],["oil","1 tbsp"]],["Heat the oil in a wok or karahi over high heat.","Add the chicken and sear 5-6 minutes until it whitens and picks up colour. Do not crowd the pan.","Add the ginger-garlic paste and cook one minute.","Add the chopped tomatoes and cook on high, pressing them down, for 10-12 minutes until they collapse completely and oil separates. Keep the heat up — karahi is a fast, dry cook, not a simmer.","Add the cumin, black pepper and garam masala and toss for 2 minutes.","Finish with julienned ginger, green chilli and plenty of fresh coriander."],300,"","Medium cost · everyday Pakistani ingredients",0),
R2("Grilled Fish with Lemon & Herbs","🍛",["lunch","dinner"],36,3,14,40,false,["desi","meat","high-protein"],[["white fish fillets","600g"],["lemon juice","1 tbsp"],["garlic","2 cloves"],["parsley","2 tbsp, chopped"],["black pepper","to taste"],["paprika","1 tsp"],["olive oil","1 tsp"]],["Pat the fillets completely dry — wet fish steams instead of searing.","Mix the lemon juice, crushed garlic, paprika, parsley, olive oil and black pepper.","Rub over the fish and leave 20-30 minutes. Do not marinate longer; the lemon will start to cook the flesh.","Heat a griddle or heavy pan until properly hot.","Cook 4-5 minutes on the first side without moving it, then flip once and give it 3-4 minutes more.","It is done when the flesh turns opaque and flakes with light pressure. Serve with extra lemon."],159,"","Medium cost · everyday Pakistani ingredients",0),
R2("Healthy Fish Curry","🍛",["lunch","dinner"],33,12,16,40,false,["desi","meat","high-protein"],[["white fish","600g"],["onion","1 medium"],["tomatoes","2 medium"],["garlic","2 cloves"],["ginger","1 tsp, grated"],["turmeric","1 tsp"],["coriander","2 tbsp, chopped"],["coconut milk (light)","as needed"],["oil","1 tbsp"]],["Season the fish with salt and turmeric and set aside for 15 minutes.","Heat the oil and fry the onion 6-8 minutes until golden.","Add the garlic and ginger, cook a minute, then the tomatoes and remaining spices.","Cook 8-10 minutes until the masala is thick and the oil separates. Get this stage right before the fish goes in — it only needs minutes.","Add the coconut milk and a splash of water and bring to a gentle simmer.","Slide in the fish, spoon gravy over it, and cook 6-8 minutes without stirring. Shake the pan instead of using a spoon. Finish with coriander."],226,"","Medium cost · everyday Pakistani ingredients",0),
R2("Daal Gosht","🍛",["lunch","dinner"],32,37,15,40,false,["desi","meat","high-protein"],[["lean mutton","300g"],["masoor dal","1 cup"],["onion","1 medium"],["tomato","1 medium"],["ginger-garlic","1 tbsp"],["spices","1 tsp"]],["Rinse the masoor dal and soak 20 minutes.","Brown the mutton in the oil with the onion over high heat, 8-10 minutes, until it takes real colour.","Add the ginger-garlic and cook a minute, then the tomato and spices. Bhunno until the oil separates.","Add 3 cups of water, cover, and cook until the mutton is tender — about 45 minutes in a pot, 20 in a pressure cooker.","Add the drained dal and cook a further 20-25 minutes until it breaks down into the gravy.","Mash lightly against the side of the pot to thicken, then finish with garam masala, fried onion and coriander."],350,"","Medium cost · everyday Pakistani ingredients",0),
R2("Healthy Paneer Bhurji","🍛",["breakfast","lunch","dinner"],22,8,19,40,true,["desi","vegetarian","high-protein"],[["low-fat paneer","450g"],["onion","1 medium"],["tomato","1 medium"],["peas","1 cup"],["turmeric","1 tsp"],["cumin","1 tsp"],["coriander","2 tbsp, chopped"],["oil","1 tbsp"]],["Crumble the paneer coarsely by hand — grating makes it too fine and it turns pasty.","Heat the oil and soften the onion for 4-5 minutes.","Add the tomato, turmeric and cumin and cook until the tomato breaks down.","Stir in the peas and cook 3 minutes.","Add the paneer and toss gently for 3-4 minutes, just enough to heat through and take on the masala.","Stop there. Paneer goes rubbery if it cooks long. Finish with coriander and a squeeze of lemon."],205,"","Medium cost · everyday Pakistani ingredients",0),
R2("Lean Mutton Karahi","🍛",["lunch","dinner"],38,2,33,40,false,["desi","meat","high-protein"],[["lean mutton","600g"],["tomatoes","2 medium"],["ginger-garlic","1 tbsp"],["black pepper","to taste"],["cumin","1 tsp"],["coriander","2 tbsp, chopped"],["oil","1 tbsp"]],["Heat the oil in a karahi and brown the mutton hard over high heat for 8-10 minutes.","Add the ginger-garlic paste and cook until the raw smell goes.","Add half a cup of water, cover, and cook 40-50 minutes until the meat is tender. Top up with a little hot water if it dries out.","Uncover, raise the heat, and add the chopped tomatoes. Cook 12-15 minutes until they collapse and the oil separates out.","Add the cumin and black pepper and bhunno hard for the last 5 minutes — this is what gives karahi its dry, clinging gravy.","Finish with julienned ginger, green chilli and coriander."],186,"","High cost · everyday Pakistani ingredients",0),
R2("Beef Steak Masala","🍛",["lunch","dinner"],42,1,24,40,false,["desi","meat","high-protein"],[["lean beef steaks","4"],["garlic","2 cloves"],["black pepper","to taste"],["paprika","1 tsp"],["yogurt marinade","2 tbsp"]],["Take the steaks out of the fridge 30 minutes before cooking so they cook evenly.","Mix the yogurt with the crushed garlic, paprika and black pepper and rub it over the meat. Leave 1-2 hours.","Wipe off the excess marinade — anything left on the surface will burn rather than sear.","Heat a heavy pan until it is very hot. Sear the steaks 3-4 minutes per side for medium, less if they are thin.","Rest them on a warm plate for 5 minutes. Cutting straight away loses the juices.","Slice against the grain and spoon over any resting juices."],188,"","High cost · everyday Pakistani ingredients",0),
R2("Healthy Prawn Curry","🍛",["lunch","dinner"],34,24,8,40,false,["desi","meat","high-protein"],[["prawns","500g"],["onion","1 medium"],["tomato","1 medium"],["garlic","2 cloves"],["ginger","1 tsp, grated"],["turmeric","1 tsp"],["coriander","2 tbsp, chopped"],["light coconut milk","as needed"]],["Pat the prawns dry and season with salt and turmeric.","Heat the oil and fry the onion 6-8 minutes until golden.","Add the garlic and ginger, then the tomato and remaining spices. Cook 8 minutes until thick and the oil separates.","Add the coconut milk and bring to a gentle simmer.","Add the prawns and cook 4-5 minutes only, until they curl and turn opaque.","Take them off the heat immediately — prawns go rubbery within a minute of being done. Finish with coriander and lemon."],198,"","High cost · everyday Pakistani ingredients",0),
R2("Salmon Tikka","🍛",["lunch","dinner"],37,2,23,40,false,["desi","meat","high-protein"],[["salmon","600g"],["yogurt","2 tbsp"],["lemon","1"],["garlic","2 cloves"],["paprika","1 tsp"],["cumin","1 tsp"]],["Cut the salmon into large 4cm cubes so they hold together on the skewer.","Mix the yogurt, lemon juice, crushed garlic, paprika and cumin with salt.","Coat the salmon and refrigerate 30-60 minutes. No longer — the acid starts breaking the fish down.","Thread onto skewers, leaving a small gap between pieces so they cook rather than steam.","Bake at 200°C for 12-15 minutes, or grill 4 minutes a side, turning carefully.","It is ready when the outside chars lightly and the centre is just opaque. Serve with lemon and onion rings."],162,"","High cost · everyday Pakistani ingredients",0),
R2("Healthy Chicken Reshmi Kebab","🍛",["lunch","dinner"],39,6,17,40,false,["desi","meat","high-protein"],[["chicken breast","600g"],["yogurt","2 tbsp"],["cashews (small amount)","2 tbsp"],["ginger-garlic","1 tbsp"],["pepper","to taste"]],["Soak the cashews in hot water 15 minutes, then blend to a smooth paste with the yogurt.","Mix this with the ginger-garlic paste, white pepper and salt.","Cut the chicken into cubes or mince it coarsely, then coat in the marinade and refrigerate at least 2 hours.","Thread onto skewers with wet hands so the mixture does not stick to you.","Grill or bake at 200°C for 15-18 minutes, turning once and basting with a little oil.","Reshmi means silky, so pull them off as soon as they are cooked through — overcooking makes them dry and grainy."],164,"","High cost · everyday Pakistani ingredients",0),

/* Ingredients that make a dish expensive in a Pakistani kitchen. Anything
   without them is treated as low budget, which is how the desi cookbook's
   own "Very Low / Low" tags line up. */
const PRICEY=new RegExp(['salmon','shrimp','prawn','scallop','lamb','mutton','beef','steak',
  'sirloin','cashew','pistachio','pine nut','feta','parmesan','goat cheese','halloumi',
  'quinoa','tahini','maple','saffron','almond butter'].join('|'),'i');
const SIZES={
  "Black Coffee":[["Regular",240],["Large",360]],
  "Espresso":[["Regular",30],["Large",60]],
  "Americano":[["Regular",240],["Large",360]],
  "Latte":[["Regular",240],["Large",360]],
  "Latte (skim milk)":[["Regular",240],["Large",360]],
  "Cappuccino":[["Regular",180],["Large",300]],
  "Flat White":[["Regular",200],["Large",320]],
  "Mocha":[["Regular",240],["Large",360]],
  "Caramel Macchiato":[["Regular",240],["Large",360]],
  "Cortado":[["Regular",120],["Large",200]],
  "Doodh Patti Coffee":[["Regular",200],["Large",300]],
  "Cold Coffee":[["Regular",300],["Large",450]],
  "Iced Latte":[["Regular",300],["Large",450]],
  "Iced Americano":[["Regular",300],["Large",450]],
  "Frappuccino":[["Regular",300],["Large",450]],
  "Affogato":[["Regular",120],["Large",200]],
  "Turkish Coffee":[["Regular",90],["Large",150]],
  "Bulletproof Coffee":[["Regular",240],["Large",360]]
};
RECIPES.forEach((r,i)=>{
  r.id=i; r.k=Math.round(r.p*4+r.c*4+r.f*9);
  if(SIZES[r.n]) r.sizes=SIZES[r.n];
  r.drink=r.tags.includes('coffee');
  const blob=r.n+' '+r.ing.map(x=>x[0]).join(' ');
  r.desi=r.tags.includes('desi');
  r.cheap=r.tags.includes('low budget')||!PRICEY.test(blob);
  r.salad=/\bsalads?\b|\bslaw\b|caesar/i.test(r.n);
  r.slug=r.n.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48);
});

/* ==================== NUTRITION CALCULATIONS ====================
   BMR: Mifflin-St Jeor (1990) — the most accurate general equation.
     men:   10w + 6.25h - 5a + 5
     women: 10w + 6.25h - 5a - 161
   TDEE = BMR x activity factor.
   Deficit/surplus is capped so the plan never drops below a safe floor
   (1200 kcal women / 1500 kcal men, per general clinical guidance).
   ================================================================= */
const ACT={
  sed:{f:1.2,  l:'Sedentary',  d:'Desk job, little exercise'},
  lite:{f:1.375,l:'Light',      d:'Light exercise 1-3 days/week'},
  mod:{f:1.55, l:'Moderate',   d:'Exercise 3-5 days/week'},
  high:{f:1.725,l:'Very active',d:'Hard exercise 6-7 days/week'},
  ath:{f:1.9,  l:'Athlete',    d:'Physical job or 2x daily training'}
};
const GOALS={
  loss:{l:'Fat loss',   e:'📉', d:'Lose fat, keep muscle', adj:-0.20, split:[0.35,0.35,0.30]},
  maint:{l:'Maintain',  e:'⚖️', d:'Stay at current weight', adj:0,     split:[0.30,0.40,0.30]},
  gain:{l:'Muscle gain',e:'💪', d:'Build lean mass',        adj:+0.15, split:[0.30,0.45,0.25]},
  bulk:{l:'Weight gain',e:'📈', d:'Gain weight steadily',   adj:+0.25, split:[0.25,0.50,0.25]}
};

function bmr(p){
  const base = 10*p.w + 6.25*p.h - 5*p.age;
  return Math.round(p.sex==='m' ? base+5 : base-161);
}
function tdee(p){ return Math.round(bmr(p)*ACT[p.act].f); }
function targets(p){
  const t=tdee(p), g=GOALS[p.goal];
  const floor = p.sex==='m' ? 1500 : 1200;
  const cal = Math.max(floor, Math.round((t*(1+g.adj))/10)*10);
  const [pp,cp,fp]=g.split;
  // Protein floor of 1.6 g/kg for anyone training or losing fat.
  let prot = Math.round(cal*pp/4);
  const minP = Math.round(p.w*(p.goal==='maint'?1.2:1.6));
  if(prot<minP) prot=minP;
  let fat = Math.round(cal*fp/9);
  let carb = Math.round((cal - prot*4 - fat*9)/4);
  if(carb<50){ carb=50; fat=Math.max(30,Math.round((cal-prot*4-carb*4)/9)); }
  return {cal, p:prot, c:carb, f:fat, tdee:t, bmr:bmr(p)};
}
function bmi(p){ const m=p.h/100; return +(p.w/(m*m)).toFixed(1); }
function bmiBand(v){
  if(v<18.5) return ['Underweight','var(--c)'];
  if(v<25)   return ['Healthy','var(--brand)'];
  if(v<30)   return ['Overweight','var(--c)'];
  return ['Obese','var(--danger)'];
}
/* Rough weekly change: 7700 kcal ~= 1 kg of body mass. */
function weeklyChange(p){
  const t=targets(p);
  return +(((t.cal - t.tdee)*7)/7700).toFixed(2);
}

/* ======================= DAY TOTALS ======================= */
function dayTotal(d){
  const rows=S.log[d]||[];
  return rows.reduce((a,x)=>({p:a.p+x.p,c:a.c+x.c,f:a.f+x.f,k:a.k+x.k}),{p:0,c:0,f:0,k:0});
}
function T(){ return S.profile? targets(S.profile) : {cal:2000,p:150,c:200,f:67}; }

/* ==================== ENERGY EXPENDITURE ====================
   Exercise burn uses the standard MET equation:
       kcal/min = MET × 3.5 × kg / 200
   One MET is resting metabolism, which TDEE already pays for, so we
   charge (MET − 1) and credit only the *extra* energy the activity cost.
   Otherwise an hour of sitting would appear to burn 70 kcal.

   Steps are treated the same way. The first STEP_BASE steps are the
   incidental walking any activity multiplier already assumes, so only
   steps beyond that earn calories. Stride length comes from height.

   Water is deliberately absent: warming a glass of cold water to body
   temperature costs roughly 8 kcal, which is noise against a 2,000 kcal
   day. It is tracked as hydration, not as energy.
   ============================================================ */
const INTENSITY={
  light:{l:'Light',   met:3.0, d:'Walking, stretching, light housework'},
  mod:  {l:'Moderate',met:5.8, d:'Brisk walk, cycling, gym, football'},
  hard: {l:'Vigorous',met:8.5, d:'Running, HIIT, heavy lifting, squash'}
};
const STEP_BASE=3000;          // steps assumed inside the activity factor
const WALK_KCAL_PER_KG_KM=0.40; // net cost of walking a kilometre

function exerciseBurn(min,intensity,kg){
  const m=INTENSITY[intensity]||INTENSITY.mod;
  return Math.max(0, Math.round((m.met-1)*3.5*kg/200*min));
}
function stepBurn(steps,kg,heightCm){
  const extra=Math.max(0,(steps||0)-STEP_BASE);
  if(!extra) return 0;
  const strideM=heightCm*0.415/100;
  const km=extra*strideM/1000;
  return Math.round(WALK_KCAL_PER_KG_KM*kg*km);
}
function burnedOn(d){
  if(!S.profile) return {ex:0,steps:0,total:0};
  const kg=S.profile.w, h=S.profile.h;
  const ex=(S.exercise[d]||[]).reduce((a,e)=>a+exerciseBurn(e.min,e.int,kg),0);
  const st=stepBurn(S.steps[d]||0,kg,h);
  return {ex,steps:st,total:ex+st};
}
/* Calories available to eat today = target plus whatever was burned. */
function allowanceOn(d){ return T().cal + burnedOn(d).total; }

/* What the step goal is worth, so the day's budget can be shown as something
   to walk towards rather than only as something already earned. */
function stepOutlook(d){
  const kg=S.profile?S.profile.w:70, h=S.profile?S.profile.h:170;
  const now=S.steps[d]||0, goal=S.prefs.stepGoal;
  const earned=stepBurn(now,kg,h);
  const atGoal=stepBurn(Math.max(now,goal),kg,h);
  return {now,goal,earned,atGoal,extra:Math.max(0,atGoal-earned),
          left:Math.max(0,goal-now),hit:now>=goal};
}


/* ==================== MEAL PLAN GENERATOR ====================
   Greedy fit: each meal slot gets a share of the day's calories, then a
   recipe is chosen by (a) how close it lands to that slot's calories and
   (b) how recently it was used, so the week doesn't repeat itself.
   Serving size is then scaled (0.5x-2x) to close the remaining gap.
   ============================================================== */
const SLOTS=[
  {k:'breakfast',l:'Breakfast',share:.25},
  {k:'lunch',    l:'Lunch',    share:.35},
  {k:'snack',    l:'Snack',    share:.10},
  {k:'dinner',   l:'Dinner',   share:.30}
];

function generatePlan(){
  const t=T(), veg=S.prefs.veg;
  const used={};                      // recipeId -> last day index used
  const days=[];
  for(let d=0; d<7; d++){
    const meals=[];
    for(const sl of SLOTS){
      const want=t.cal*sl.share;
      const pool=RECIPES.filter(r=>r.t.includes(sl.k) && (!veg || r.veg));
      let best=null,bestScore=1e9;
      for(const r of pool){
        const gap=Math.abs(r.k-want)/want;
        const last=used[r.id];
        const recency = last===undefined ? 0 : Math.max(0,(4-(d-last)))*0.55;
        const jitter=Math.random()*0.18;
        const sc=gap+recency+jitter;
        if(sc<bestScore){bestScore=sc;best=r;}
      }
      if(!best) continue;
      used[best.id]=d;
      let serv=clamp(Math.round((want/best.k)*4)/4, .5, 2);
      meals.push({id:best.id, slot:sl.k, serv});
    }
    balanceDay(meals,t.cal);
    // Big surplus targets can't be met with four capped servings — add a
    // second snack rather than serving someone an implausible 3x portion.
    for(let extra=0; extra<3 && t.cal-planDayTotals(meals).k>200; extra++){
      const pool=RECIPES.filter(r=>r.t.includes('snack')&&(!veg||r.veg)
        &&!meals.some(m=>m.id===r.id));
      if(!pool.length) break;
      const gap=t.cal-planDayTotals(meals).k;
      const pick=pool.reduce((a,b)=>Math.abs(b.k-gap)<Math.abs(a.k-gap)?b:a);
      meals.splice(3,0,{id:pick.id,slot:'snack',serv:clamp(Math.round(gap/pick.k*4)/4,.5,2)});
      balanceDay(meals,t.cal);
    }
    days.push(meals);
  }
  S.plan={start:today(),days}; save();
}
/* Nudge servings in 0.25 steps (never outside 0.5x-2x) until the day's
   calories sit as close to target as the available dishes allow. */
function balanceDay(meals,goal){
  for(let pass=0; pass<24; pass++){
    const gap=goal-planDayTotals(meals).k;
    if(Math.abs(gap)<40) break;
    const dir=gap>0?0.25:-0.25;
    // adjust the meal whose 0.25 step best shrinks the gap
    let pick=null,bestLeft=Math.abs(gap);
    for(const m of meals){
      const ns=+(m.serv+dir).toFixed(2);
      if(ns<0.5||ns>2) continue;
      const left=Math.abs(gap-dir*RECIPES[m.id].k);
      if(left<bestLeft){bestLeft=left;pick=m;}
    }
    if(!pick) break;
    pick.serv=+(pick.serv+dir).toFixed(2);
  }
}
function planDayTotals(meals){
  return meals.reduce((a,m)=>{const r=RECIPES[m.id];
    return {p:a.p+r.p*m.serv,c:a.c+r.c*m.serv,f:a.f+r.f*m.serv,k:a.k+r.k*m.serv};},
    {p:0,c:0,f:0,k:0});
}


/* ==================== HEIGHT: FEET & INCHES ====================
   Height is entered and displayed in ft/in, but stored in centimetres
   because Mifflin-St Jeor is defined in metric. One conversion point,
   so rounding can't drift.
   ================================================================ */
const CM_PER_IN=2.54;
function cmToFtIn(cm){
  const totalIn=Math.round(cm/CM_PER_IN);
  return {ft:Math.floor(totalIn/12), in:totalIn%12};
}
function ftInToCm(ft,inch){ return +(((+ft||0)*12+(+inch||0))*CM_PER_IN).toFixed(1); }
function htLabel(cm){ const h=cmToFtIn(cm); return h.ft+"'"+h.in+'"'; }

/* ==================== STORAGE DURABILITY ====================
   localStorage survives closing the tab, closing the browser and
   restarting the phone. It is only lost if site data is cleared, the
   page is opened in a private window, or the browser evicts the origin
   under storage pressure. persist() asks the browser not to evict.
   ============================================================= */
let storagePersisted=null;
async function requestPersistence(){
  try{
    if(navigator.storage && navigator.storage.persist){
      storagePersisted = await navigator.storage.persisted();
      if(!storagePersisted) storagePersisted = await navigator.storage.persist();
    }
  }catch(e){ storagePersisted=null; }
  return storagePersisted;
}
function storageWorks(){
  try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); return true; }
  catch(e){ return false; }
}
function importBackup(file){
  const fr=new FileReader();
  fr.onload=()=>{
    try{
      const data=JSON.parse(fr.result);
      if(!data || typeof data!=='object' || !('log' in data))
        return toast('That file is not a NutriPlan backup');
      const days=Object.keys(data.log||{}).length;
      if(!confirm('Restore this backup? It will replace your current data.\n\n'
        +days+' logged day(s) in the file.')) return;
      S=Object.assign(blank(),data); save();
      document.body.classList.toggle('dark',!!S.prefs.dark);
      closeModal(); toast('Backup restored'); render();
    }catch(e){ toast('Could not read that file'); }
  };
  fr.readAsText(file);
}
/* Nudge for a backup if it has been a while and there is data worth keeping. */
function backupDue(){
  const n=Object.keys(S.log).length;
  if(n<5) return false;
  const last=S.prefs.lastBackup||0;
  return (Date.now()-last) > 14*24*3600*1000;
}

/* ============================ SVG PRIMITIVES ============================ */
function polar(cx,cy,r,deg){const a=(deg-90)*Math.PI/180;return[cx+r*Math.cos(a),cy+r*Math.sin(a)];}
function arcPath(cx,cy,r,s,e){
  if(e-s<=0.01) return '';
  const [x1,y1]=polar(cx,cy,r,s),[x2,y2]=polar(cx,cy,r,Math.min(e,s+359.99));
  const large=(e-s)>180?1:0;
  return `M${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x2.toFixed(2)} ${y2.toFixed(2)}`;
}
let uid=0; const nid=()=>'g'+(++uid);

/* 270° gauge with a dotted inner track — the kit's signature component. */
function gauge(pct,opts){
  const o=Object.assign({size:196,icon:ic('flame',22),big:'',small:'',c1:'var(--violet)',c2:'var(--violet-3)',over:false},opts);
  const s=o.size, cx=s/2, cy=s/2, r=s/2-18, id=nid();
  const p=clamp(pct,0,1), sweep=270*p;
  return `<div class="gauge" style="width:${s}px;height:${s}px">
    <svg width="${s}" height="${s}" viewBox="0 0 ${s} ${s}">
      <defs><linearGradient id="${id}" x1="0" y1="1" x2="1" y2="0">
        <stop offset="0" stop-color="${o.over?'var(--coral)':o.c1}"/>
        <stop offset="1" stop-color="${o.over?'var(--amber)':o.c2}"/></linearGradient></defs>
      <path d="${arcPath(cx,cy,r,225,495)}" stroke="var(--line)" stroke-width="13"
        fill="none" stroke-linecap="round"/>

function donut(pct,color,label,sub,size){

  return `<div class="center">

          style="transition:stroke-dashoffset .6s cubic-bezier(.4,0,.2,1)"/>

/* Catmull-Rom smoothed polyline — the soft curve used throughout the kit. */
function smooth(pts){
  if(pts.length<2) return '';
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)},`
      +`${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)},`
      +`${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function spline(vals,labels,opts){
  const o=Object.assign({h:150,stroke:'#fff',fill:'rgba(255,255,255,.18)',dot:'#fff',
    showLast:true,pad:18},opts);
  const W=340,H=o.h,pad=o.pad,top=16,bot=labels?26:12;
  const clean=vals.filter(v=>v!=null);
  if(clean.length<2) return `<div class="empty" style="padding:26px 8px">Not enough data yet — keep logging.</div>`;
  let lo=Math.min(...clean), hi=Math.max(...clean);
  if(hi-lo<1){ const m=(hi+lo)/2; lo=m-1; hi=m+1; }
  const px=i=>pad+(i/(vals.length-1))*(W-pad*2);
  const py=v=>H-bot-((v-lo)/(hi-lo))*(H-top-bot);
  const pts=vals.map((v,i)=>[px(i),py(v==null?lo:v)]);
  const d=smooth(pts);
  const last=pts[pts.length-1];
  const lb=labels?labels.map((l,i)=>`<text x="${px(i)}" y="${H-6}" text-anchor="middle">${l}</text>`).join(''):'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="height:${H}px">
    <path d="${d} L${last[0]} ${H-bot} L${pts[0][0]} ${H-bot} Z" fill="${o.fill}" stroke="none"/>
    <path d="${d}" fill="none" stroke="${o.stroke}" stroke-width="2.6"
      stroke-linecap="round" stroke-linejoin="round"/>
    ${o.showLast?`<circle cx="${last[0]}" cy="${last[1]}" r="6.5" fill="${o.dot}"
      stroke="${o.stroke}" stroke-width="2.5"/>`:''}
    ${lb}</svg>`;
}
function bars(vals,labels,goal){
  const W=340,H=150,pad=14,bot=24,top=14;
  const max=Math.max(goal?goal*1.2:0,...vals,1);
  const bw=(W-pad*2)/vals.length;
  const y=v=>H-bot-(v/max)*(H-top-bot);
  const b=vals.map((v,i)=>{
    const x=pad+i*bw+bw*0.22, w=Math.max(bw*0.56,4), h=Math.max(v>0?3:0,H-bot-y(v));
    const over=goal&&v>goal*1.05;
    return `<rect x="${x.toFixed(1)}" y="${y(v).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}"
      rx="${Math.min(w/2,5)}" fill="${v===0?'var(--line)':(over?'var(--coral)':'var(--violet)')}"/>`;}).join('');
  const gl=goal?`<line x1="${pad}" x2="${W-pad}" y1="${y(goal)}" y2="${y(goal)}"
      stroke="var(--violet-3)" stroke-dasharray="3 5" stroke-width="1.4"/>`:'';
  const lb=labels.map((l,i)=>l?`<text x="${(pad+i*bw+bw/2).toFixed(1)}" y="${H-6}"
      text-anchor="middle">${l}</text>`:'').join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"
    style="height:${H}px">${gl}${b}${lb}</svg>`;
}
function macBar(l,v,g,col){
  const pct=clamp(g?v/g*100:0,0,100);
  return `<div class="mac"><div class="t"><span><i class="sw" style="background:${col}"></i>${l}</span>
    <span>${Math.round(v)} / ${Math.round(g)} g</span></div>
    <div class="bar"><i style="width:${pct}%;background:${col}"></i></div></div>`;
}
function weekStrip(dates,activeIdx,onclickFn,markFn){
  return `<div class="week">${dates.map((d,i)=>{

}

   conflicting group wins, so "deep fried" never also counts as "fried". */
const METHODS=[
  {k:['deep fried','deep-fried','deep fry'],f:1.9,fAdd:8,label:'deep fried',g:'cook'},
  {k:['fried','fry','talay','tala','crispy','crumbed','battered','pan fried'],

      'air fried','airfried','skewer'],f:0.8,label:'grilled or baked',g:'cook'},
  {k:['boiled','boil','steamed','steam','poached','raw'],label:'boiled or steamed',g:'cook'},
  {k:['creamy','cream','malai','makhani','white sauce','alfredo','cheesy','mayo',
      'mayonnaise','caesar','ranch','thousand island'],
    f:1.15,fAdd:5,cAdd:2,label:'creamy',g:'rich'},
  {k:['desi ghee','with ghee','in ghee'],fAdd:5,label:'cooked in ghee',g:'rich'},
  {k:['black coffee','black tea','no milk','without milk','plain coffee','plain tea'],
    p:0.1,c:0.15,f:0.1,label:'no milk',g:'milk'},
  {k:['low fat','lowfat','skim','light','lite','diet','without oil','no oil','oil free','oil-free'],
    f:0.5,label:'low fat',g:'diet'},
  {k:['sugar free','sugarfree','no sugar','unsweetened','without sugar'],
    c:0.6,label:'no sugar',g:'diet'},
  {k:['whole wheat','wholemeal','brown','multigrain','atta'],label:'wholegrain',g:'grain'}
];
const FALLBACK={p:8,c:20,f:8};   /* generic mixed dish, per 100 g */

function estimate(name,grams){
  const q=' '+String(name).toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ')+' ';
  const has=k=>q.includes(' '+k+' ')||q.includes(' '+k)||q.includes(k+' ');
  const hits=[];
  for(const b of BASES){ const kw=b.k.find(has); if(kw) hits.push({...b,kw}); }

  let prof,conf,matched=[];
  if(hits.length){
    const tw=hits.reduce((a,b)=>a+b.w,0);
    prof={p:0,c:0,f:0};
    for(const b of hits){
      prof.p+=b.p*b.w/tw; prof.c+=b.c*b.w/tw; prof.f+=b.f*b.w/tw;
      matched.push(b.kw);
    }
    conf = hits.some(h=>h.w>=5) ? 'good' : (hits.length>=2 ? 'good' : 'fair');
  } else { prof={...FALLBACK}; conf='rough'; }

  const usedGroups=new Set();
  for(const m of METHODS){
    if(usedGroups.has(m.g)) continue;          // one modifier per group
    if(!m.k.some(k=>q.includes(k))) continue;
    usedGroups.add(m.g);
    if(m.p)    prof.p*=m.p;
    if(m.f)    prof.f*=m.f;
    if(m.fAdd) prof.f=Math.max(0,prof.f+m.fAdd);
    if(m.c)    prof.c*=m.c;
    if(m.cAdd) prof.c+=m.cAdd;
    if(m.label) matched.push(m.label);
    if(conf==='rough') conf='fair';
  }
  const mult=grams/100;
  const p=+(prof.p*mult).toFixed(1), c=+(prof.c*mult).toFixed(1), f=+(prof.f*mult).toFixed(1);
  return {p,c,f,k:kcal(p,c,f),matched:[...new Set(matched)],conf,
          per100:Math.round(prof.p*4+prof.c*4+prof.f*9)};
}

            rough:['Very rough','var(--coral)']};

   keyword estimator the food logger uses, and are flagged in the UI. */

  }
  r.k=Math.round(r.p*4+r.c*4+r.f*9);
});

  A('Ketchup','1 tbsp',17,0.2,4.4,0,['bread','meat','snack']),
  A('Yogurt dressing','2 tbsp',30,1.2,1.8,0.9,['salad','veg']),
  A('Olive oil drizzle','1 tsp',5,0,0,5,['salad','veg','grain']),
  A('Ghee','1 tsp',5,0,0,5,['curry','grain','legume','veg']),
  A('Peanut butter','1 tbsp',16,4,3.2,8,['drinkish','grain']),
  A('Almonds','10 pieces',12,2.5,2.6,6,['drinkish','grain','salad']),
  A('Banana','1 medium',120,1.3,27,0.4,['drinkish','grain']),
  A('Honey','1 tsp',7,0,5.7,0,['drinkish','grain']),
  A('Whey scoop','1 scoop',30,24,3,1.8,['drinkish','grain']),
  A('Extra paneer','50 g',50,9,1.7,10.5,['veg','curry','salad']),
  A('Fried onion','1 tbsp',10,0.5,2,3,['curry','grain'])
];
ADDONS.forEach((a,i)=>a.id=i);
/* Which contexts a recipe belongs to. The dish name carries the form of the
   meal and is trusted for it; ingredients only fill in what's inside. An
   earlier version scanned the tags too, which meant the tag "high-protein"
   made almost every recipe look like a protein shake. */
function recipeCtx(r){
  const name=r.n.toLowerCase();
  const both=(name+' '+r.ing.map(i=>i[0]).join(' ')).toLowerCase();
  const ctx=new Set();
  const N=re=>re.test(name), A=re=>re.test(both);
  if(N(/smoothie|shake|lassi|latte/))                                   ctx.add('drinkish');
  if(N(/pasta|noodle|spaghetti|\bmac\b|orzo|penne|rigatoni|lasagna|shells|lo mein/)) ctx.add('pasta');
  if(N(/soup|stew|chowder|bisque|chili|shorba/))                        ctx.add('soup');
  if(N(/salad|slaw|caesar/))                                            ctx.add('salad');
  if(N(/bread|toast|sandwich|wrap|burrito|pita|\broll\b|taco|tostada|pizza|burger|socca|crunchwrap|quesadilla|nacho/)) ctx.add('bread');
  if(N(/\begg|frittata|omelet|shakshuka|scramble/))                     ctx.add('egg');
  if(N(/curry|masala|tikka|korma|karahi|tinga|butter chicken|tandoori/)) ctx.add('curry');
  if(A(/lentil|chickpea|\bbean|\bdaal?\b|hummus|tofu|tempeh|falafel|edamame/)) ctx.add('legume');
  if(A(/\brice\b|quinoa|couscous|bulgur|farro|\boats?\b|risotto|grain/)) ctx.add('grain');
  if(A(/cauliflower|broccoli|spinach|kale|zucchini|mushroom|potato|carrot|vegetables?|veggies?/)) ctx.add('veg');
  if(A(/chicken|beef|salmon|shrimp|\bfish\b|turkey|lamb|meatball|steak|prawn/)) ctx.add('meat');
  if(!ctx.size) ctx.add('meat');
  return ctx;
}
/* Three add-ons per dish, hand-picked per dish type. A long list of every
   vaguely compatible extra is noise; three relevant ones are a decision. */
const ADDON_PICKS={
  drinkish:['Peanut butter','Banana','Whey scoop'],
  pasta:   ['Grated cheddar','Mushrooms, sautéed','Olives'],
  bread:   ['Cheese slice','Garlic mayo','Chicken sausage'],
  salad:   ['Feta / crumbled paneer','Boiled egg','Olive oil drizzle'],
  egg:     ['Cheese slice','Mushrooms, sautéed','Chicken sausage'],
  soup:    ['Extra roti','Cheese slice','Olive oil drizzle'],
  curry:   ['Extra roti','Raita','Ghee'],
  legume:  ['Extra rice','Boiled egg','Green chutney'],
  grain:   ['Grilled chicken, extra','Boiled egg','Olive oil drizzle'],
  veg:     ['Extra paneer','Feta / crumbled paneer','Olive oil drizzle'],
  meat:    ['Cheese slice','Mushrooms, sautéed','Green chutney']
};
/* Dish form wins over protein: a chicken curry should offer roti and raita,
   not cheese, so 'curry' is checked before 'meat'. */
const CTX_ORDER=['drinkish','pasta','bread','salad','egg','soup','curry','legume','grain','veg','meat'];
function addonsFor(r){
  /* Add-ons belong on composed dishes. A latte does not need peanut butter,
     and a plain food logged from the quick list is not a recipe at all. */
  if(r.drink) return [];
  const ctx=recipeCtx(r);
  const key=CTX_ORDER.find(k=>ctx.has(k))||'meat';
  return (ADDON_PICKS[key]||ADDON_PICKS.meat)
    .map(n=>ADDONS.find(a=>a.n===n)).filter(Boolean).slice(0,3);
}

/* A recipe may offer more than one size (coffee does). The stored macros are
   for the first size, so the others scale by their own volume. */
function sizeFactor(r){
  return (r.sizes && r.sizes[recSize]) ? r.sizes[recSize][1]/r.sizes[0][1] : 1;
}
function recipeTotals(){
  const r=RECIPES[recId], s=recServ*sizeFactor(RECIPES[recId]);

  return {p,c,f,g:Math.round(g),k:kcal(p,c,f)};
}

/* Patch only the parts that changed — re-rendering the whole sheet would
   replay its slide-up animation on every tap. */
function recipePatch(){
  const m=recipeTotals(), r=RECIPES[recId];
  const k=$('recKcal'); if(k) k.textContent=m.k;
  const sv=$('recServ');
  if(sv){
    const unit=r.sizes?' ml':' g';

      +' ('+Math.round(r.g*recServ*sizeFactor(r))+unit+')';

  const ad=$('recAdd'); if(ad) ad.innerHTML=addonChips(addonsFor(r));
  const sz=$('recSizes'); if(sz&&r.sizes) sz.innerHTML=sizeChips(r);
}
