/* Portion options are chosen for the food. Offering "1 glass" and "Large
   plate" for a naan is noise; a bread wants halves and pieces, a drink wants
   glasses, an oil wants spoons. */
/* Drop repeats by both wording and weight; a food whose own serving is
   "1 glass" must not be offered "1 glass" twice. */
function dedupePortions(list){
  const byLabel=new Set(), byGram=new Set(), out=[];
  list.forEach(([l,g])=>{
    const k=l.toLowerCase().trim();
    if(byLabel.has(k)||byGram.has(g)) return;
    byLabel.add(k); byGram.add(g); out.push([l,g]);
  });
  return out;
}
function portionsFor(f){
  if(!f) return PORTIONS;
  const n=f.n.toLowerCase(), own=[f.pl,f.g];
  const half=['half '+f.pl.replace(/^1\s*/,''), Math.round(f.g/2)];
  /* liquid dairy is filed under 'dairy' but pours like a drink */
  if(f.cat==='drink'||/\b(milk|lassi|juice|shake|smoothie|tea|coffee|water)\b/.test(n))
    return dedupePortions([own,['1 cup',200],['1 glass',250],['1 mug',350],['100 ml',100]]);
  if(f.cat==='fat'||f.cat==='supp'||/\bpickle|chutney|ketchup|mayo|honey|sugar|jam\b/.test(n))
    return dedupePortions([own,['1 tsp',5],['1 tbsp',15],['30 g',30]]);
  if(f.cat==='nut')
    return dedupePortions([own,['10 g',10],['30 g',30],['50 g',50]]);
  if(/roti|naan|paratha|bread|rusk|slice|toast|bun|pita|tortilla|sheermal/.test(n))
    return dedupePortions([own,half,['2 '+f.pl.replace(/^1\s*/,''),f.g*2],['100 g',100]]);
  if(f.cat==='fruit'||/egg|kabab|samosa|pakora|biscuit|piece/.test(n))
    return dedupePortions([own,half,['2 '+f.pl.replace(/^1\s*/,''),f.g*2],['100 g',100]]);
  /* Pick one vessel and stay with it. Rice-based dishes go on a plate;
     everything else — curries, pasta, daal, soup — goes in a bowl. Offering
     both in one list makes the choice harder, not easier. */
  const RICE=/\b(rice|chawal|biryani|pulao|pilaf|khichdi|quinoa|couscous|risotto|bulgur)\b/;
  const vessel = RICE.test(n)
    ? [['Half plate',175],['1 plate',350],['1 large plate',500]]
    : [['Half bowl',75],['1 small bowl',150],['1 large bowl',300]];
  /* If the food's own serving already names a vessel, drop it rather than
     showing a plate and a bowl side by side. */
  const ownNamesVessel=/plate|bowl/i.test(own[0]);
  return dedupePortions((ownNamesVessel ? [] : [own]).concat(vessel, [['100 g',100]]));
}
function portionChips(){
  const f = port.type==='food' ? FOODS[port.id] : null;
  const seen=new Set(), labels=new Set(), opts=[];
  /* de-duplicate on both weight and wording, so a dish whose own serving is
     "1 plate" doesn't get a second "1 plate" at a different weight */
  portionsFor(f).forEach(([l,g])=>{
    const key=l.toLowerCase();
    if(seen.has(g)||labels.has(key)) return;
    seen.add(g); labels.add(key); opts.push([l,g]);
  });
  return opts.map(([l,g])=>`<button class="chip ${port.grams===g?'on':''}"
    onclick="setPortion('${esc(l).replace(/'/g,'')}',${g})">${esc(l)}</button>`).join('');
}
function portQtyLabel(){
  if(port.type==='recipe'){
    const r=RECIPES[port.id];
    return port.qty+(port.qty===1?' serving':' servings')+` (${Math.round(r.g*port.qty)} g)`;
  }
  return port.qty+' × '+esc(port.label)+` (${Math.round(port.grams*port.qty)} g)`;
}
function portionNut(){
  const m=portMacros();
  return `<div class="g3" style="margin-top:16px">
    ${donut(1,'var(--p)','Protein',Math.round(m.p)+' g',62)}
    ${donut(1,'var(--c)','Carbs',Math.round(m.c)+' g',62)}
    ${donut(1,'var(--f)','Fat',Math.round(m.f)+' g',62)}</div>`;
}
function portionPatch(){
  const m=portMacros();
  const k=$('portKcal'); if(k) k.textContent=m.k;
  const n=$('portNut'); if(n) n.innerHTML=portionNut();
  const q=$('portQty'); if(q) q.textContent=portQtyLabel();
  const c=$('portChips'); if(c) c.innerHTML=portionChips();
  const g=$('portG'); if(g) g.value=port.grams;
}
function setPortion(label,grams){ port.label=label; port.grams=grams; portionPatch(); }
function setQty(d){ port.qty=clamp(+(port.qty+d).toFixed(2),0.25,10); portionPatch(); }
function setGrams(v){ const g=Math.max(1,Math.min(3000,+v||1));
  port.grams=g; port.label=g+' g'; portionPatch(); }
function logPortion(){
  const m=portMacros(), q=port.qty;
  const label = port.type==='recipe'

  closeModal(); toast(port.name+' logged'); render();
}

function lastDays(n){ const a=[]; for(let i=n-1;i>=0;i--) a.push(addDays(today(),-i)); return a; }
function viewStats(){
  const t=T(), days=lastDays(statRange);
  const cals=days.map(d=>dayTotal(d).k);
  const allows=days.map(d=>t.cal+burnedOn(d).total);
  const burns=days.map(d=>burnedOn(d).total);
  const logged=cals.filter(v=>v>0);
  const avg=logged.length?Math.round(logged.reduce((a,b)=>a+b,0)/logged.length):0;
  const onTarget=days.filter((d,i)=>cals[i]>0&&Math.abs(cals[i]-allows[i])<=allows[i]*0.1).length;
  const adherence=logged.length?Math.round(onTarget/logged.length*100):0;
  const streak=(()=>{let n=0;for(let i=0;i<365;i++){if((S.log[addDays(today(),-i)]||[]).length)n++;else break;}return n;})();

  const wAll=Object.entries(S.weights).sort((a,b)=>a[0]<b[0]?-1:1);
  const wIn=wAll.filter(([d])=>days.includes(d));
  const wSeries=wIn.length>1?wIn:wAll;
  const delta=wSeries.length>1?+(wSeries[wSeries.length-1][1]-wSeries[0][1]).toFixed(1):0;

  const avgP=logged.length?Math.round(days.reduce((a,d)=>a+dayTotal(d).p,0)/logged.length):0;
  const waterDays=days.map(d=>S.water[d]||0).filter(v=>v>0);
  const avgW=waterDays.length?Math.round(waterDays.reduce((a,b)=>a+b,0)/waterDays.length):0;
  const stepDays=days.map(d=>S.steps[d]||0).filter(v=>v>0);
  const avgS=stepDays.length?Math.round(stepDays.reduce((a,b)=>a+b,0)/stepDays.length):0;

  /* A week is short enough to read as calendar dates. Over 30 or 90 days a
     month date tells you nothing, so count days instead: 1 is the oldest,
     the last label is the range itself. */
  const labels=days.map((d,i)=>{
    const step=Math.ceil(days.length/7);
    const show=days.length<=7 || i%step===0 || i===days.length-1;
    if(!show) return '';
    return days.length<=7 ? String(parseISO(d).getDate()) : String(i+1);
  });
  const b=bmi(S.profile), band=bmiBand(b), proj=weeklyChange(S.profile);

  return `<div class="vh">
      <div class="ov">Progress</div>
      <h1 class="big">${avg?`You averaged <span style="opacity:.75">${avg.toLocaleString()} kcal</span>`
        :'Start logging to see trends'}</h1>
      <div class="sm" style="opacity:.8;margin-top:8px;font-weight:500">
        ${logged.length} of the last ${statRange} days logged</div>
      <div class="seg" style="margin-top:18px">
        ${[[7,'Week'],[30,'Month'],[90,'90 days']].map(([n,l])=>
          `<button class="${statRange===n?'on':''}" onclick="statRange=${n};render()">${l}</button>`).join('')}
      </div>
    </div>
    <div class="sheet-b">
      <div class="c">
        <div class="ov m">Calories logged</div>
        ${bars(cals,labels,t.cal)}
        <div class="tiny center">Dashed line is your ${t.cal.toLocaleString()} kcal target,
          before anything you burned</div>
      </div>

      <div class="g3" style="margin-bottom:16px">
        <div class="stat"><b>${avg?avg.toLocaleString():'—'}</b><span>avg kcal</span>
          <div class="dl ${avg>t.cal?'up':'down'}">${avg?(avg-t.cal>0?'+':'')+(avg-t.cal):'no data'}</div></div>
        <div class="stat"><b>${adherence}%</b><span>on target</span>
          <div class="dl">${onTarget}/${logged.length} days</div></div>
        <div class="stat"><b>${streak}</b><span>day streak</span>
          <div class="dl">${streak>2?'on a roll':'keep going'}</div></div>
      </div>

      <div class="vcard">
        <div class="row" style="margin-bottom:6px">
          <div><div class="ov">Weight trend</div>
            <div><b class="num" style="font-size:26px">${wSeries.length?wSeries[wSeries.length-1][1]:S.profile.w}</b>
              <span style="font-size:12px;opacity:.8;font-weight:600"> kg</span></div></div>
          ${wSeries.length>1?`<span class="chip" style="background:rgba(255,255,255,.22);color:#fff;box-shadow:none">
            ${delta>0?'+':''}${delta} kg</span>`:''}</div>
        ${spline(wSeries.map(x=>x[1]),null,{h:130})}
        <div class="tiny" style="color:rgba(255,255,255,.78);margin-top:6px">
          At your current targets you'd change about <b>${proj>0?'+':''}${proj} kg per week</b>.</div>
      </div>

      <div class="g3" style="margin-bottom:16px">
        <div class="stat"><b>${(()=>{const b=burns.filter(v=>v>0);
          return b.length?Math.round(b.reduce((a,x)=>a+x,0)/b.length):'—';})()}</b>
          <span>avg burned</span><div class="dl">exercise + steps</div></div>
        <div class="stat"><b>${avgP||'—'}</b><span>avg protein</span><div class="dl">${t.p} g target</div></div>
        <div class="stat"><b>${avgS?(avgS/1000).toFixed(1)+'k':'—'}</b><span>avg steps</span>
          <div class="dl">${avgW||0} glasses water</div></div>
      </div>

      <div class="c">
        <div class="ov m">Body</div>
        <div class="it" style="padding-top:6px">
          <div class="tile s" style="background:#EFECFF">${ic('ruler',20)}</div>
          <div class="mid"><div class="nm">BMI ${b}</div>
            <div class="dt">${htLabel(S.profile.h)} · ${S.profile.w} kg</div></div>
          <div class="rt"><b style="color:${band[1]};font-size:13.5px">${band[0]}</b></div></div>
        <div class="it"><div class="tile s" style="background:#E4F8FA">${ic('flame',20)}</div>
          <div class="mid"><div class="nm">Maintenance (TDEE)</div>
            <div class="dt">${t.bmr.toLocaleString()} kcal burned at complete rest</div></div>
          <div class="rt"><b>${t.tdee.toLocaleString()}</b></div></div>
        <div class="it"><div class="tile s" style="background:#FFF1E8">${ic(GOALIC[S.profile.goal],20)}</div>
          <div class="mid"><div class="nm">${GOALS[S.profile.goal].l}</div>
            <div class="dt">your daily calorie target</div></div>
          <div class="rt"><b>${t.cal.toLocaleString()}</b></div></div>
      </div>
    </div>`;
}

function saveProfile(){
  const p=S.profile;
  const age=+$('pAge').value, ft=+$('pFt').value, inch=+$('pIn').value, w=+$('pW').value;
  const h=ftInToCm(ft,inch);
  if(!(age>=13&&age<=100))  return toast('Age must be between 13 and 100');
  if(!(inch>=0&&inch<12))   return toast('Inches must be between 0 and 11');
  if(!(h>=120&&h<=230))     return toast("Height must be between 3'11\" and 7'7\"");
  if(!(w>=30&&w<=300))      return toast('Weight must be between 30 and 300 kg');
  Object.assign(p,{age,h,w,sex:$('pSex').value,act:$('pAct').value,goal:$('pGoal').value});
  S.weights[today()]=w;
  generatePlan(); save(); toast('Targets updated'); render();
}
function togglePref(k){
  S.prefs[k]=!S.prefs[k]; save();
  if(k==='dark') document.body.classList.toggle('dark',S.prefs.dark);
  if(k==='veg') generatePlan();
  render();
}
function exportData(){
  S.prefs.lastBackup=Date.now(); save();
  const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='nutriplan-backup-'+today()+'.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  toast('Backup downloaded'); render();
}
function wipe(){
  if(!confirm('This erases your profile, food log and weight history for good. Continue?')) return;
  if(!confirm('Really erase everything? Download a backup first if you might want it back.')) return;
  localStorage.removeItem(KEY); S=blank(); document.body.classList.remove('dark');
  tab='today'; step=0; render();
}

      <div style="display:flex;gap:10px">
        <button class="btn line" style="flex:0 0 92px" onclick="step=1;render()">Back</button>

      ${foodPattern()}
      ${dotsLight}
      <h1 class="big">What's the goal?</h1>
      <div class="sm" style="opacity:.85;margin-top:8px;font-weight:500">

      </div>
      <div style="display:flex;gap:10px">
        <button class="btn line" style="flex:0 0 92px" onclick="step=2;render()">Back</button>
        <button class="btn" onclick="finish()">Build my plan</button></div></div>`;
}
function stepOne(){
  draft.name=$('oName').value.trim();
  draft.age=+$('oAge').value; draft.ft=+$('oFt').value; draft.in=+$('oIn').value; draft.w=+$('oW').value;
  const h=ftInToCm(draft.ft,draft.in);
  if(!(draft.age>=13&&draft.age<=100)) return toast('Enter an age between 13 and 100');
  if(!(draft.in>=0&&draft.in<12))      return toast('Inches must be between 0 and 11');
  if(!(h>=120&&h<=230))                return toast("Enter a height between 3'11\" and 7'7\"");
  if(!(draft.w>=30&&draft.w<=300))     return toast('Enter a weight between 30 and 300 kg');
  step=2; render();
}
function finish(){
  S.profile=draftProfile();
  S.weights[today()]=+draft.w;
  generatePlan(); save(); tab='today'; step=0;
  requestPersistence().then(()=>{});
  toast('All set — your plan is ready'); render();
}

/* ============================== RENDER ============================== */
function render(){
  if(parseISO(logDate)>parseISO(today())) logDate=today();
  const appEl=$('app');
  if(!S.profile){
    appEl.className = step===0 ? 'ob' : '';
    appEl.innerHTML=onboarding(); $('nav').innerHTML=''; return;
  }
  appEl.className='';
  const views={today:viewToday,plan:viewPlan,recipes:viewRecipes,stats:viewStats,me:viewMe};
  $('app').innerHTML=(views[tab]||viewToday)();
  nav();
  if(tab==='me') showPersistNote();
}
function showPersistNote(){
  const el=$('persistNote'); if(!el) return;
  if(!storageWorks()){
    el.innerHTML=`<b style="color:var(--coral)">⚠ This browser is blocking storage.</b>
      You are probably in a private/incognito window — data will vanish when you close it.`;
    return;
  }
  if(storagePersisted===true) el.innerHTML='🔒 Storage is marked persistent — the browser will not evict your data.';
  else el.innerHTML='Data survives closing the browser and restarting your phone. '
    +'It is only lost if you clear site data or use a private window — keep a backup file.';
}

       return !(l.includes('plate') && l.includes('bowl'));}));
  ok('rice dishes are served on a plate',(()=>{
      const f=FOODS.find(x=>/^Boiled rice/.test(x.n));
      const l=portionsFor(f).map(x=>x[0].toLowerCase()).join(' ');
      return l.includes('plate') && !l.includes('bowl');})());
  ok('pasta and curries are served in a bowl',
     ['Pasta, cooked','Chicken karahi','Vegetable soup'].every(n=>{
       const f=FOODS.find(x=>x.n===n); if(!f) return true;
       const l=portionsFor(f).map(x=>x[0].toLowerCase()).join(' ');
       return l.includes('bowl') && !l.includes('plate');}));
  ok('the word katori is gone',
     !FOODS.some(f=>/katori/i.test(f.pl)) &&
     !FOODS.some(f=>portionsFor(f).some(x=>/katori/i.test(x[0]))) &&
     !ADDONS.some(a=>/katori/i.test(a.amt)));
  ok('drinks carry no add-ons',
     RECIPES.filter(r=>r.drink).every(r=>addonsFor(r).length===0));
  ok('composed dishes still carry add-ons',
     RECIPES.filter(r=>!r.drink).every(r=>addonsFor(r).length>0));
  ok('biryani and pulao are out of the quick-add list',
     !FOODS.some(f=>/biryani|pulao/i.test(f.n)));
  ok('storage available', storageWorks());
  console.log(out.join('\n'));
  return out;
};

/* Register the service worker so the app opens offline once installed.
   Skipped on file:// where service workers are not permitted. */
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
/* Chrome fires this instead of installing straight away; surface our own
   button so the install path is obvious on a phone. */
let deferredInstall = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault(); deferredInstall = e;
  const b = document.getElementById('installBtn');
  if (b) b.style.display = 'block';
});
function promptInstall(){
  if (!deferredInstall) return toast('Use your browser menu → Install app');
  deferredInstall.prompt();
  deferredInstall.userChoice.finally(() => { deferredInstall = null; });
}

</script>
